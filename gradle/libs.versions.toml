[versions]
commons-compress = "1.28.0"
compose = "1.12.2"
coroutines = "1.11.0"
detekt = "1.23.8"
errorprone = "2.51.0"
errorprone-plugin = "5.1.1"
fabric-api = "0.165.0+26.3"
