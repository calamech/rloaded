name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: jetbrains
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Check
        run: ./gradlew check --stacktrace

  game-test:
    name: game-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: jetbrains
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The pinned server, runtime and mods, downloaded once per set of pins.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rloaded-game-tests/build/game-test/cache
          key: game-test-${{ hashFiles('rloaded-core/src/main/resources/io/github/calamech/rloaded/core/runtime/runtime-pins.json') }}
      - name: Game tests
        run: ./gradlew :rloaded-game-tests:gameTest --stacktrace
      - name: Staging dry run
        run: ./gradlew :rloaded-game-tests:stagingTest --stacktrace
      - name: Restart after a failed live add
        run: ./gradlew :rloaded-game-tests:restartTest --stacktrace

  client-game-test:
    name: client-game-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The runner has no sound card: OpenAL Soft's null backend gives the games a silent device, so a
    # resource reload does not log an error about the sound system.
    env:
      ALSOFT_DRIVERS: "null"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: jetbrains
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The pinned client and server, runtime and mods, downloaded once per set of pins.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            rloaded-game-tests/build/client-game-test/cache
            rloaded-game-tests/build/registry-sync-test/server-cache
          key: client-game-test-${{ hashFiles('rloaded-core/src/main/resources/io/github/calamech/rloaded/core/runtime/runtime-pins.json') }}
      # The client needs a display and a graphics backend: a virtual display, and Mesa's software
      # Vulkan, which the game picks when OpenGL is not available, as on Fabric API's own CI.
      - name: Virtual display
        run: sudo apt-get update && sudo apt-get install --yes xvfb mesa-vulkan-drivers
      - name: Client game tests
        run: xvfb-run --auto-servernum ./gradlew :rloaded-game-tests:clientGameTest --stacktrace
      - name: Registry sync with a separate server and two clients
        run: xvfb-run --auto-servernum ./gradlew :rloaded-game-tests:registrySyncTest --stacktrace
      - name: First join with mods from a separate server
        run: xvfb-run --auto-servernum ./gradlew :rloaded-game-tests:joinTest --stacktrace
      - name: In-session add
        run: xvfb-run --auto-servernum ./gradlew :rloaded-game-tests:addTest --stacktrace
      - name: Twenty adds in a row
        run: xvfb-run --auto-servernum ./gradlew :rloaded-game-tests:soakTest --stacktrace
      - name: Restart and rejoin after a failed install
        run: xvfb-run --auto-servernum ./gradlew :rloaded-game-tests:recoveryTest --stacktrace
      - name: Add from the launcher to an open singleplayer world
        run: xvfb-run --auto-servernum ./gradlew :rloaded-game-tests:singleplayerTest --stacktrace
